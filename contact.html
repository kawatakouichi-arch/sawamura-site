<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 作りかけの間は検索に載せない（公開するときにこの行を消す） -->
  <meta name="robots" content="noindex, nofollow">
  <title>Contact | sawamura yasuko hair&amp;make.</title>
  <meta name="description" content="お問い合わせ。結婚式、前撮り、まつ毛・眉毛、メイクレッスン、お仕事のご依頼など、お気軽にお問い合わせください。">

  <!-- フォント（index.html と同じ） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&family=Shippori+Mincho&family=Zen+Old+Mincho&family=Klee+One&family=Zen+Maru+Gothic:wght@300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== ヘッダー（index.html と共通） ===== -->
  <header class="header">
    <p class="header__title">
      <a href="index.html">
        <span class="header__name">sawamura yasuko</span>
      </a>
    </p>

    <button class="menu-btn" aria-label="メニューを開く" aria-expanded="false" aria-controls="global-nav">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="global-nav">
      <ul class="nav__list">
        <li><a href="index.html">Home</a></li>
        <li><a href="wedding.html">Wedding</a></li>
        <li><a href="eyelash.html">Eyelash &amp; Eyebrow</a></li>
        <li><a href="lesson.html">Make Lesson</a></li>
        <li><a href="shooting.html">Shooting</a></li>
        <li><a href="price.html">price</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="is-current">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== 1. ページ名＋ひとこと（メイン写真はなし） ===== -->
    <section class="page-title">
      <h1 class="page-title__en">Contact</h1>
      <p class="page-title__ja">お問い合わせ</p>
    </section>

    <section class="wedding-intro contact-intro">
      <p class="wedding-intro__text">
        結婚式、前撮り、まつ毛・眉毛、<br class="sp-br">メイクレッスン、お仕事のご依頼など<br>
        お気軽にお問い合わせください
      </p>
    </section>

    <!-- ===== 2. フォーム =====
         HTML版は見た目だけで、送信はしません（action は空・送信ボタンを押しても何も起きない）。
         本番は WordPress の Contact Form 7 などで、同じ項目・同じ見た目のフォームを作ります。 -->
    <section class="contact-form">
      <form class="form" action="" method="post" novalidate onsubmit="return false;">

        <!-- 基本の項目 -->
        <div class="form__group">
          <div class="form__row">
            <p class="form__label" id="label-type">ご相談内容<span class="form__required">必須</span></p>
            <div class="form__checks" role="group" aria-labelledby="label-type">
              <label for="type-wedding"><input type="checkbox" id="type-wedding" name="type" value="結婚式">結婚式</label>
              <label for="type-photo"><input type="checkbox" id="type-photo" name="type" value="前撮り">前撮り</label>
              <label for="type-eyelash"><input type="checkbox" id="type-eyelash" name="type" value="まつ毛・眉毛">まつ毛・眉毛</label>
              <label for="type-lesson"><input type="checkbox" id="type-lesson" name="type" value="メイクレッスン">メイクレッスン</label>
              <label for="type-shooting"><input type="checkbox" id="type-shooting" name="type" value="撮影のお仕事">撮影のお仕事</label>
              <label for="type-other"><input type="checkbox" id="type-other" name="type" value="その他">その他</label>
            </div>
          </div>

          <div class="form__row">
            <label class="form__label" for="name">お名前<span class="form__required">必須</span></label>
            <input class="form__input" type="text" id="name" name="name" placeholder="例：山田 花子" autocomplete="name" required>
          </div>

          <div class="form__row">
            <label class="form__label" for="kana">ふりがな<span class="form__required">必須</span></label>
            <input class="form__input" type="text" id="kana" name="kana" placeholder="例：やまだ はなこ" required>
          </div>

          <div class="form__row">
            <label class="form__label" for="email">メールアドレス<span class="form__required">必須</span></label>
            <input class="form__input" type="email" id="email" name="email" autocomplete="email" required>
          </div>

          <div class="form__row">
            <label class="form__label" for="tel">電話番号</label>
            <input class="form__input" type="tel" id="tel" name="tel" autocomplete="tel">
          </div>
        </div>

        <!-- 結婚式・前撮りの方向けの項目 -->
        <p class="form__group-note">結婚式・前撮りの方は、わかる範囲でご記入ください</p>
        <div class="form__group">
          <div class="form__row">
            <label class="form__label" for="date">日程</label>
            <input class="form__input" type="date" id="date" name="date">
          </div>

          <div class="form__row">
            <label class="form__label" for="venue">会場名</label>
            <input class="form__input" type="text" id="venue" name="venue">
          </div>

          <div class="form__row">
            <label class="form__label" for="time">お時間</label>
            <input class="form__input" type="text" id="time" name="time" placeholder="例：挙式 11:00〜 など">
          </div>

          <div class="form__row">
            <label class="form__label" for="detail">お支度内容</label>
            <div>
              <input class="form__input" type="text" id="detail" name="detail" placeholder="例：新婦 洋装1点、お色直し1回 など" aria-describedby="detail-hint">
              <p class="form__hint" id="detail-hint">決まっていない場合は空欄で大丈夫です</p>
            </div>
          </div>
        </div>

        <!-- メッセージ（少し間をあける） -->
        <div class="form__group form__group--message">
          <div class="form__row">
            <label class="form__label" for="message">メッセージ<span class="form__required">必須</span></label>
            <textarea class="form__input form__textarea" id="message" name="message" required></textarea>
          </div>
        </div>

        <!-- ===== 3. 送信ボタン ===== -->
        <div class="form__submit">
          <button type="submit" class="btn-submit">Send</button>
        </div>
      </form>
    </section>
  </main>

  <!-- ===== フッター（index.html と共通） ===== -->
  <footer class="footer">
    <a href="#" class="pagetop">Page Top</a>

    <a href="https://www.instagram.com/" class="footer__sns" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.3" cy="6.7" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
    </a>

    <p class="footer__copy">Copyright &copy; <span id="year">2026</span> sawamura yasuko</p>
  </footer>

  <!-- 拡大表示（ギャラリー用・index.html と共通） -->
  <div class="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="閉じる">&times;</button>
    <div class="lightbox__inner ph" data-label=""></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
